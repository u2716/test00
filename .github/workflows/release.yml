name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build and Sign Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.version }}"
          fi
          VERSION=${TAG#v}
          
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$CODE" >> $GITHUB_ENV

      - name: Build Release APK
        run: gradle :app:assembleRelease -PreleaseVersionName=${{ env.VERSION_NAME }} -PreleaseVersionCode=${{ env.VERSION_CODE }} --no-daemon --stacktrace

      - name: Sign APK
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478 # v1.0.6
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '34.0.0'

      - name: Prepare Artifacts
        run: |
          mkdir -p release-artifacts
          # Find all signed APKs, parse the architecture, and copy them to the artifacts folder
          for file in app/build/outputs/apk/release/*-signed.apk; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              
              # Extract the ABI (e.g., app-arm64-v8a-release-signed.apk -> arm64-v8a)
              abi=$(echo "$filename" | cut -d'-' -f2)
              
              # Handle universal APK naming
              if [[ "$filename" == *"universal"* ]]; then
                abi="universal"
              fi
              
              cp "$file" "release-artifacts/ScreenLookup-${abi}-${{ env.TAG }}.apk"
              echo "Copied $file to ScreenLookup-${abi}-${{ env.TAG }}.apk"
            fi
          done
          
          # Verify we actually have files, otherwise fail the build
          if [ -z "$(ls -A release-artifacts)" ]; then
            echo "Error: No signed APKs were found in app/build/outputs/apk/release/"
            exit 1
          fi

      - name: Create Draft Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ env.TAG }}
          name: ScreenLookup ${{ env.TAG }}
          draft: true
          prerelease: false
          files: release-artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
